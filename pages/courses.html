<section class="py-24 px-6 bg-slate-50 dark:bg-slate-950 min-h-screen relative overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-full pointer-events-none opacity-20">
        <div class="absolute top-[10%] left-[5%] w-72 h-72 bg-brand blur-[120px] rounded-full animate-pulse"></div>
        <div class="absolute bottom-[10%] right-[5%] w-96 h-96 bg-accent blur-[120px] rounded-full animate-pulse"></div>
    </div>

    <div class="max-w-7xl mx-auto relative z-10">
        <h2 class="text-4xl md:text-6xl font-black uppercase mb-20 text-center tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-brand via-accent to-brand py-4" 
            data-lang="courses_title"></h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-12">
            
            <div class="course-card group perspective-2000" onclick="this.classList.toggle('flipped')">
                <div class="card-inner relative w-full h-[450px] transition-all duration-[0.8s] transform-style-3d shadow-2xl rounded-[2.5rem] cursor-pointer">
                    <div class="card-front absolute inset-0 backface-hidden bg-white dark:bg-slate-900 flex flex-col p-0 rounded-[2.5rem] border border-brand/10 group-hover:border-brand/40 transition-colors overflow-hidden">
                        <div class="relative h-full w-full overflow-hidden">
                            <img src="assets/images/defence-course.jpg" alt="Defence Training" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                            <div class="absolute inset-0  from-white dark:from-slate-900 to-transparent"></div>
                        </div>
                        <div class="flex flex-col items-center justify-center p-6 flex-grow">
                            <h3 class="text-2xl font-black uppercase tracking-tight text-brand dark:text-white text-center leading-tight" data-lang="course_defence_title"></h3>
                            <div class="mt-4 px-4 py-2 bg-slate-100 dark:bg-white/5 rounded-full">
                                <p class="text-accent font-black text-[10px] uppercase tracking-widest" data-lang="Details">Details</p>
                            </div>
                        </div>
                    </div>
                    <div class="card-back absolute inset-0 backface-hidden bg-gradient-to-br from-brand to-brand-dark text-white p-10 rounded-[2.5rem] flex items-center rotate-y-180 shadow-inner">
                        <ul class="space-y-6 w-full">
                            <li class="flex items-center gap-3 font-bold text-lg border-b border-white/10 pb-2" data-lang="course_defence_1"></li>
                            <li class="flex items-center gap-3 font-bold text-lg border-b border-white/10 pb-2" data-lang="course_defence_2"></li>
                            <li class="flex items-center gap-3 font-bold text-lg border-b border-white/10 pb-2" data-lang="course_defence_3"></li>
                            <li class="flex items-center gap-3 font-bold text-lg" data-lang="course_defence_4"></li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="course-card group perspective-2000" onclick="this.classList.toggle('flipped')">
                <div class="card-inner relative w-full h-[450px] transition-all duration-[0.8s] transform-style-3d shadow-2xl rounded-[2.5rem] cursor-pointer">
                    <div class="card-front absolute inset-0 backface-hidden bg-white dark:bg-slate-900 flex flex-col p-0 rounded-[2.5rem] border border-brand/10 group-hover:border-brand/40 transition-colors overflow-hidden">
                        <div class="relative h-full w-full overflow-hidden">
                            <img src="assets/images/ssc-course.jpg" alt="SSC GD" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                            <div class="absolute inset-0 from-white dark:from-slate-900 to-transparent"></div>
                        </div>
                        <div class="flex flex-col items-center justify-center p-6 flex-grow">
                            <h3 class="text-2xl font-black uppercase tracking-tight text-brand dark:text-white text-center leading-tight" data-lang="course_ssc_title"></h3>
                            <div class="mt-4 px-4 py-2 bg-slate-100 dark:bg-white/5 rounded-full">
                                <p class="text-accent font-black text-[10px] uppercase tracking-widest" data-lang="Details">Details</p>
                            </div>
                        </div>
                    </div>
                    <div class="card-back absolute inset-0 backface-hidden bg-gradient-to-br from-accent to-orange-600 text-white p-10 rounded-[2.5rem] flex items-center rotate-y-180 shadow-inner">
                        <ul class="space-y-6 w-full">
                            <li class="font-bold text-lg border-b border-white/10 pb-2" data-lang="course_ssc_1"></li>
                            <li class="font-bold text-lg" data-lang="course_ssc_2"></li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="course-card group perspective-2000" onclick="this.classList.toggle('flipped')">
                <div class="card-inner relative w-full h-[450px] transition-all duration-[0.8s] transform-style-3d shadow-2xl rounded-[2.5rem] cursor-pointer">
                    <div class="card-front absolute inset-0 backface-hidden bg-white dark:bg-slate-900 flex flex-col p-0 rounded-[2.5rem] border border-brand/10 group-hover:border-brand/40 transition-colors overflow-hidden">
                        <div class="relative h-full w-full overflow-hidden">
                            <img src="assets/images/fitness-course.jpg" alt="Fitness Training" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                            <div class="absolute inset-0 from-white dark:from-slate-900 to-transparent"></div>
                        </div>
                        <div class="flex flex-col items-center justify-center p-6 flex-grow">
                            <h3 class="text-2xl font-black uppercase tracking-tight text-brand dark:text-white text-center leading-tight" data-lang="course_fitness_title"></h3>
                            <div class="mt-4 px-4 py-2 bg-slate-100 dark:bg-white/5 rounded-full">
                                <p class="text-accent font-black text-[10px] uppercase tracking-widest" data-lang="Details">Details</p>
                            </div>
                        </div>
                    </div>
                    <div class="card-back absolute inset-0 backface-hidden bg-gradient-to-br from-slate-800 to-black text-white p-10 rounded-[2.5rem] flex items-center rotate-y-180 border-2 border-brand/30 shadow-inner">
                        <ul class="space-y-6 w-full">
                            <li class="font-bold text-lg border-b border-white/10 pb-2" data-lang="course_fitness_1"></li>
                            <li class="font-bold text-lg border-b border-white/10 pb-2" data-lang="course_fitness_2"></li>
                            <li class="font-bold text-lg border-b border-white/10 pb-2" data-lang="course_fitness_3"></li>
                            <li class="font-bold text-lg" data-lang="course_fitness_4"></li>
                        </ul>
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>
